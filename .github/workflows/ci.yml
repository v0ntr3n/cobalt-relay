name: GServer Rust CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  check-and-test:
    name: Build, Clippy & E2E Suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: gserver-linux-x64
            bin_path: target/release/gserver
          - os: windows-latest
            artifact_name: gserver-windows-x64
            bin_path: target/release/gserver.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Preserve LF line endings on Windows checkout
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Build workspace (Release, offline)
        shell: bash
        run: |
          mkdir -p ci_logs
          set -o pipefail
          cargo build --workspace --release --offline 2>&1 | tee ci_logs/build.log

      - name: Lint workspace with Clippy (-D warnings)
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --offline -- -D warnings 2>&1 | tee -a ci_logs/build.log

      - name: Run all unit, fuzz & full-stack E2E tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --offline 2>&1 | tee -a ci_logs/build.log

      - name: Upload release server binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.bin_path }}
            server.toml
            tools/export_db_to_json.py
          if-no-files-found: error

      - name: Post failure log on PR if failed
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let tail = 'No log captured.';
            if (fs.existsSync('ci_logs/build.log')) {
              const lines = fs.readFileSync('ci_logs/build.log', 'utf8').split(/\r?\n/);
              tail = lines.slice(-100).join('\n').slice(-20000);
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### CI Failure on \`${{ matrix.os }}\`\n\`\`\`text\n${tail}\n\`\`\``
            });
