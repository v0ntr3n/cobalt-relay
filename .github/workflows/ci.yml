name: GServer Rust CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-and-test:
    name: Build, Clippy & E2E Suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: gserver-linux-x64
            bin_path: target/release/gserver
          - os: windows-latest
            artifact_name: gserver-windows-x64
            bin_path: target/release/gserver.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Build workspace (Release, offline)
        run: cargo build --workspace --release --offline

      - name: Lint workspace with Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets --offline -- -D warnings

      - name: Run all unit, fuzz & full-stack E2E tests
        run: cargo test --workspace --offline

      - name: Upload release server binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.bin_path }}
            server.toml
            tools/export_db_to_json.py
          if-no-files-found: error
